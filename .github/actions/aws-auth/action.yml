name: "AWS OIDC Authentication"
description: "Configure AWS credentials using GitHub OIDC provider and assume deployment role"
inputs:
  aws-region:
    description: "AWS region"
    required: true
  role-arn:
    description: "IAM role ARN to assume"
    required: true
  role-session-name:
    description: "Session name for the assumed role"
    required: false
    default: "github-actions-session"

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: ${{ inputs.role-session-name }}
        aws-region: ${{ inputs.aws-region }}
        role-duration-seconds: 3600

    - name: Verify AWS authentication
      shell: bash
      run: |
        echo "Verifying AWS authentication..."
        aws sts get-caller-identity
        echo "AWS CLI configured successfully"

    - name: Set AWS environment variables
      shell: bash
      run: |
        echo "AWS_DEFAULT_REGION=${{ inputs.aws-region }}" >> $GITHUB_ENV
        echo "AWS_REGION=${{ inputs.aws-region }}" >> $GITHUB_ENV
