name: "Setup Dependencies"
description: "Install Bun, Python/uv, and AWS SAM CLI with dependency caching"
inputs:
  cache-enabled:
    description: "Enable dependency caching"
    required: false
    default: "true"
  bun-version:
    description: "Bun version to install"
    required: false
    default: "latest"
  python-version:
    description: "Python version to install"
    required: false
    default: "3.11"
  sam-version:
    description: "AWS SAM CLI version to install"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache Bun dependencies
      if: inputs.cache-enabled == 'true'
      uses: actions/cache@v3
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/package.json') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Cache Python dependencies
      if: inputs.cache-enabled == 'true'
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          backend/.venv
        key: python-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml', '**/uv.lock') }}
        restore-keys: |
          python-${{ runner.os }}-

    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install backend dependencies
      shell: bash
      working-directory: backend
      run: |
        uv venv
        source .venv/bin/activate
        uv pip sync requirements.txt

    - name: Setup AWS SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        version: ${{ inputs.sam-version }}

    - name: Cache SAM build artifacts
      if: inputs.cache-enabled == 'true'
      uses: actions/cache@v3
      with:
        path: |
          .aws-sam/build
          .aws-sam/cache
        key: sam-${{ runner.os }}-${{ hashFiles('**/template.yaml', '**/requirements.txt') }}
        restore-keys: |
          sam-${{ runner.os }}-
