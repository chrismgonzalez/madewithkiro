name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      run-frontend-tests:
        description: "Enable frontend tests"
        required: false
        type: boolean
        default: true
      run-backend-tests:
        description: "Enable backend tests"
        required: false
        type: boolean
        default: true
      test-timeout:
        description: "Test timeout in minutes"
        required: false
        type: number
        default: 10

jobs:
  frontend-test:
    if: inputs.run-frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.test-timeout }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Cache dependencies
        uses: ./.github/actions/cache-deps

      - name: Install frontend dependencies
        run: bun install

      - name: Run TypeScript compilation check
        run: bun run build --mode development

      - name: Run TypeScript type checking
        run: bun run build --mode development --emptyOutDir false

      - name: Run frontend tests
        run: bun run test --reporter=verbose

  backend-test:
    if: inputs.run-backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.test-timeout }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Cache dependencies
        uses: ./.github/actions/cache-deps

      - name: Install backend dependencies
        run: |
          cd backend
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Python linting (ruff)
        run: |
          cd backend
          uv run ruff check .
        continue-on-error: true

      - name: Run Python formatting check (ruff)
        run: |
          cd backend
          uv run ruff format --check .
        continue-on-error: true

      - name: Run backend tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          cd backend
          uv run pytest -v --tb=short

  sam-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Validate SAM template
        run: sam validate --template-file infrastructure/template.yaml --lint

      - name: Validate OIDC template
        run: sam validate --template-file infrastructure/oidc/template.yaml --lint

      - name: Validate certificate template
        run: sam validate --template-file infrastructure/certificate/template.yaml --lint
