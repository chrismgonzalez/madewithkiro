name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev/prod)"
        required: true
        type: string
      build-frontend:
        description: "Enable frontend build"
        required: false
        type: boolean
        default: true
      build-backend:
        description: "Enable backend build"
        required: false
        type: boolean
        default: true
      cache-enabled:
        description: "Enable build caching"
        required: false
        type: boolean
        default: true
    outputs:
      frontend-artifact-name:
        description: "Name of the frontend build artifact"
        value: ${{ jobs.build-frontend.outputs.artifact-name }}
      backend-artifact-name:
        description: "Name of the backend build artifact"
        value: ${{ jobs.build-backend.outputs.artifact-name }}

jobs:
  build-frontend:
    if: inputs.build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Cache dependencies
        if: inputs.cache-enabled
        uses: ./.github/actions/cache-deps

      - name: Install frontend dependencies
        run: bun install

      - name: Set environment file for build
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            cp .env.development .env.production.local
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            cp .env.production .env.production.local
          fi

      - name: Build frontend
        run: bun run build

      - name: Clean up environment file
        run: rm -f .env.production.local

      - name: Set artifact name
        id: artifact
        run: echo "name=frontend-build-${{ inputs.environment }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          retention-days: 7

  build-backend:
    if: inputs.build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Cache dependencies
        if: inputs.cache-enabled
        uses: ./.github/actions/cache-deps

      - name: Install backend dependencies
        run: |
          cd backend
          uv pip install -e .

      - name: Build SAM application
        run: sam build

      - name: Set artifact name
        id: artifact
        run: echo "name=backend-build-${{ inputs.environment }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload SAM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .aws-sam/
          retention-days: 7
