name: Reusable Notification Workflow

on:
  workflow_call:
    inputs:
      workflow-status:
        description: "Workflow status (success/failure/cancelled)"
        required: true
        type: string
      environment:
        description: "Target environment (dev/prod)"
        required: true
        type: string
      deployment-url:
        description: "URL of deployed application"
        required: false
        type: string
      workflow-name:
        description: "Name of the calling workflow"
        required: false
        type: string
        default: "Deployment"
      additional-info:
        description: "Additional information to include in notification"
        required: false
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Prepare notification data
        id: prepare
        run: |
          # Set status emoji and color
          case "${{ inputs.workflow-status }}" in
            "success")
              echo "emoji=✅" >> $GITHUB_OUTPUT
              echo "color=3066993" >> $GITHUB_OUTPUT  # Green
              echo "status_text=Success" >> $GITHUB_OUTPUT
              ;;
            "failure")
              echo "emoji=❌" >> $GITHUB_OUTPUT
              echo "color=15158332" >> $GITHUB_OUTPUT  # Red
              echo "status_text=Failed" >> $GITHUB_OUTPUT
              ;;
            "cancelled")
              echo "emoji=⚠️" >> $GITHUB_OUTPUT
              echo "color=16776960" >> $GITHUB_OUTPUT  # Yellow
              echo "status_text=Cancelled" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "emoji=ℹ️" >> $GITHUB_OUTPUT
              echo "color=3447003" >> $GITHUB_OUTPUT  # Blue
              echo "status_text=Unknown" >> $GITHUB_OUTPUT
              ;;
          esac

          # Format environment name
          ENV_NAME=$(echo "${{ inputs.environment }}" | tr '[:lower:]' '[:upper:]')
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

          # Format timestamp
          echo "timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT

          # Format commit info
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        if: secrets.DISCORD_WEBHOOK_URL != ''
        run: |
          # Prepare Discord webhook payload
          cat > discord_payload.json << EOF
          {
            "embeds": [
              {
                "title": "${{ steps.prepare.outputs.emoji }} ${{ inputs.workflow-name }} - ${{ steps.prepare.outputs.status_text }}",
                "description": "**Environment:** ${{ steps.prepare.outputs.env_name }}\n**Repository:** ${{ github.repository }}\n**Branch:** ${{ github.ref_name }}\n**Commit:** [\`${{ steps.prepare.outputs.commit_short }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                "color": ${{ steps.prepare.outputs.color }},
                "fields": [
                  {
                    "name": "Workflow",
                    "value": "[${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                    "inline": true
                  },
                  {
                    "name": "Triggered by",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "Event",
                    "value": "${{ github.event_name }}",
                    "inline": true
                  }
          EOF

          # Add deployment URL field if provided
          if [ -n "${{ inputs.deployment-url }}" ] && [ "${{ inputs.deployment-url }}" != "None" ]; then
            cat >> discord_payload.json << EOF
                  ,{
                    "name": "🌐 Deployment URL",
                    "value": "[${{ inputs.deployment-url }}](${{ inputs.deployment-url }})",
                    "inline": false
                  }
          EOF
          fi

          # Add additional info field if provided
          if [ -n "${{ inputs.additional-info }}" ]; then
            cat >> discord_payload.json << EOF
                  ,{
                    "name": "Additional Info",
                    "value": "${{ inputs.additional-info }}",
                    "inline": false
                  }
          EOF
          fi

          # Close the JSON structure
          cat >> discord_payload.json << EOF
                ],
                "timestamp": "${{ steps.prepare.outputs.timestamp }}",
                "footer": {
                  "text": "GitHub Actions"
                }
              }
            ]
          }
          EOF

          # Send the webhook
          curl -H "Content-Type: application/json" \
               -d @discord_payload.json \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Create GitHub summary
        run: |
          echo "## ${{ steps.prepare.outputs.emoji }} ${{ inputs.workflow-name }} Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.prepare.outputs.status_text }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.prepare.outputs.env_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${{ steps.prepare.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** [\`${{ steps.prepare.outputs.commit_short }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ inputs.deployment-url }}" ] && [ "${{ inputs.deployment-url }}" != "None" ]; then
            echo "**Deployment URL:** [${{ inputs.deployment-url }}](${{ inputs.deployment-url }})" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "${{ inputs.additional-info }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Additional Information:**" >> $GITHUB_STEP_SUMMARY
            echo "${{ inputs.additional-info }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Log notification status
        run: |
          echo "Notification sent for ${{ inputs.workflow-name }} workflow"
          echo "Status: ${{ inputs.workflow-status }}"
          echo "Environment: ${{ inputs.environment }}"
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Discord notification: Sent"
          else
            echo "Discord notification: Skipped (webhook URL not configured)"
          fi
