name: Deploy to Development

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: ./.github/actions/aws-auth
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE_ARN }}

      - name: Install dependencies
        run: |
          bun install
          cd backend && uv sync

      - name: Create environment file
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
          VITE_AWS_REGION: ${{ vars.AWS_REGION }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_IDENTITY_POOL_ID: ${{ secrets.VITE_IDENTITY_POOL_ID }}
          VITE_OAUTH_REDIRECT_SIGN_IN: ${{ vars.VITE_OAUTH_REDIRECT_SIGN_IN }}
          VITE_OAUTH_REDIRECT_SIGN_OUT: ${{ vars.VITE_OAUTH_REDIRECT_SIGN_OUT }}
          VITE_ENVIRONMENT: ${{ inputs.environment }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_USE_PROXY: ${{ vars.VITE_POSTHOG_USE_PROXY }}
        run: env | grep '^VITE_\|^DEV_' > .env.development

      - name: Build frontend
        run: bun run build

      - name: Build SAM application
        run: sam build --template-file infrastructure/template.yaml

      - name: Deploy SAM stack
        run: sam deploy --config-file infrastructure/samconfig.toml --config-env dev --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Get S3 bucket and CloudFront distribution
        id: get-resources
        run: |
          STACK_NAME="madewithkiro-dev"
          S3_BUCKET=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucket`].OutputValue' --output text 2>/dev/null || echo "")
          CF_DISTRO=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text 2>/dev/null || echo "")
          echo "s3-bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "cf-distro=$CF_DISTRO" >> $GITHUB_OUTPUT

      - name: Upload frontend to S3
        if: steps.get-resources.outputs.s3-bucket != ''
        run: |
          aws s3 sync dist/ s3://${{ steps.get-resources.outputs.s3-bucket }}/ --delete

      - name: Invalidate CloudFront cache
        if: steps.get-resources.outputs.cf-distro != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.get-resources.outputs.cf-distro }} --paths "/*"
