name: Deploy to Development

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip tests (for emergency deployments)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    if: ${{ !inputs.skip-tests }}
    uses: ./.github/workflows/_test.yml
    with:
      run-frontend-tests: true
      run-backend-tests: true
      test-timeout: 15

  build:
    name: Build for Development
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/_build.yml
    with:
      environment: dev
      build-frontend: true
      build-backend: true
      cache-enabled: true

  deploy:
    name: Deploy to Development Environment
    needs: [build]
    if: always() && needs.build.result == 'success'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: development
      sam-config-env: dev
      require-approval: false
      frontend-artifact-name: ${{ needs.build.outputs.frontend-artifact-name }}
      backend-artifact-name: ${{ needs.build.outputs.backend-artifact-name }}
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEPLOYMENT_ROLE_ARN: ${{ secrets.DEPLOYMENT_ROLE_ARN }}

  notify:
    name: Send Notifications
    needs: [test, build, deploy]
    if: always()
    uses: ./.github/workflows/_notify.yml
    with:
      workflow-status: ${{ 
        (needs.deploy.result == 'success' && 'success') ||
        (needs.deploy.result == 'failure' && 'failure') ||
        (needs.deploy.result == 'cancelled' && 'cancelled') ||
        (needs.build.result == 'failure' && 'failure') ||
        (needs.test.result == 'failure' && 'failure') ||
        'failure'
      }}
      environment: development
      deployment-url: ${{ needs.deploy.outputs.deployment-url }}
      workflow-name: "Development Deployment"
      additional-info: ${{ 
        inputs.skip-tests && 'Tests were skipped for this deployment' || 
        format('Triggered by push to main branch by {0}', github.actor)
      }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [test, build, deploy, notify]
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          echo "## 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Job status summary
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Test status
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "| ✅ Tests | Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test.result }}" = "skipped" ]; then
            echo "| ⏭️ Tests | Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Tests | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Build status
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "| ✅ Build | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Build | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Deploy status
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "| ✅ Deploy | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Deploy | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Notification status
          if [ "${{ needs.notify.result }}" = "success" ]; then
            echo "| ✅ Notify | Sent |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⚠️ Notify | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Deployment URL
          if [ -n "${{ needs.deploy.outputs.deployment-url }}" ] && [ "${{ needs.deploy.outputs.deployment-url }}" != "None" ]; then
            echo "### 🌐 Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** [${{ needs.deploy.outputs.deployment-url }}](${{ needs.deploy.outputs.deployment-url }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Overall status
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "### 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "The application has been successfully deployed to the development environment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "The deployment to development environment failed. Please check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi