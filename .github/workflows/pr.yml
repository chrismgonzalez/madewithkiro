name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/_test.yml
    with:
      run-frontend-tests: true
      run-backend-tests: true
      test-timeout: 15

  build:
    name: Validation Build
    uses: ./.github/workflows/_build.yml
    with:
      environment: development
      build-frontend: true
      build-backend: true
      cache-enabled: true

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development
    needs: [test, build]
    if: needs.test.result == 'success' && needs.build.result == 'success'
    outputs:
      cloudfront_url: ${{ steps.get-resources.outputs.cloudfront_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Debug environment variables
        run: |
          echo "AWS_REGION: ${{ vars.AWS_REGION }}"
          echo "DEPLOYMENT_ROLE_ARN: ${{ secrets.DEPLOYMENT_ROLE_ARN }}"

      - name: Configure AWS credentials
        uses: ./.github/actions/aws-auth
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE_ARN }}

      - name: Install dependencies
        run: |
          bun install
          cd backend && uv venv && uv pip install -e .

      - name: Create environment file
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
          VITE_AWS_REGION: ${{ vars.AWS_REGION }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_IDENTITY_POOL_ID: ${{ secrets.VITE_IDENTITY_POOL_ID }}
          VITE_OAUTH_REDIRECT_SIGN_IN: ${{ vars.VITE_OAUTH_REDIRECT_SIGN_IN }}
          VITE_OAUTH_REDIRECT_SIGN_OUT: ${{ vars.VITE_OAUTH_REDIRECT_SIGN_OUT }}
          VITE_ENVIRONMENT: ${{ inputs.environment}}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_USE_PROXY: ${{ vars.VITE_POSTHOG_USE_PROXY }}
        run: env | grep '^VITE_\|^DEV_' > .env.development

      - name: Build frontend
        run: bun run build

      - name: Build SAM application
        run: sam build --template-file infrastructure/template.yaml

      - name: Deploy SAM stack
        run: sam deploy --config-file infrastructure/samconfig.toml --config-env dev --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Get S3 bucket and CloudFront distribution
        id: get-resources
        run: |
          STACK_NAME="madewithkiro-dev"
          S3_BUCKET=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucket`].OutputValue' --output text 2>/dev/null || echo "")
          CF_DISTRO=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text 2>/dev/null || echo "")
          CLOUDFRONT_DOMAIN=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDomainName`].OutputValue' --output text 2>/dev/null || echo "")
          echo "s3-bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "cf-distro=$CF_DISTRO" >> $GITHUB_OUTPUT
          if [ -n "$CLOUDFRONT_DOMAIN" ]; then
            echo "cloudfront_url=https://$CLOUDFRONT_DOMAIN" >> $GITHUB_OUTPUT
          else
            echo "cloudfront_url=" >> $GITHUB_OUTPUT
          fi

      - name: Upload frontend to S3
        if: steps.get-resources.outputs.s3-bucket != ''
        run: |
          aws s3 sync dist/ s3://${{ steps.get-resources.outputs.s3-bucket }}/ --delete

      - name: Invalidate CloudFront cache
        if: steps.get-resources.outputs.cf-distro != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.get-resources.outputs.cf-distro }} --paths "/*"

  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [test, build, deploy-dev]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            echo "test_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Tests passed"
            echo "test_status=passed" >> $GITHUB_ENV
          fi

      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            echo "build_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Build passed"
            echo "build_status=passed" >> $GITHUB_ENV
          fi

      - name: Check deploy results
        run: |
          if [ "${{ needs.deploy-dev.result }}" != "success" ]; then
            echo "❌ Deploy failed"
            echo "deploy_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Deploy passed"
            echo "deploy_status=passed" >> $GITHUB_ENV
          fi

      - name: Set overall status
        run: |
          if [ "$test_status" = "passed" ] && [ "$build_status" = "passed" ] && [ "$deploy_status" = "passed" ]; then
            echo "✅ All checks passed - PR is ready for review"
            echo "overall_status=success" >> $GITHUB_ENV
          else
            echo "❌ Some checks failed - PR needs attention"
            echo "overall_status=failure" >> $GITHUB_ENV
            exit 1
          fi

      - name: Create PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const testStatus = process.env.test_status;
            const buildStatus = process.env.build_status;
            const deployStatus = process.env.deploy_status;
            const overallStatus = process.env.overall_status;

            const testEmoji = testStatus === 'passed' ? '✅' : '❌';
            const buildEmoji = buildStatus === 'passed' ? '✅' : '❌';
            const deployEmoji = deployStatus === 'passed' ? '✅' : '❌';
            const overallEmoji = overallStatus === 'success' ? '✅' : '❌';

            const body = `## ${overallEmoji} PR Validation Results

            | Check | Status | Details |
            |-------|--------|---------|
            | ${testEmoji} Tests | ${testStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | ${buildEmoji} Build | ${buildStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | ${deployEmoji} Deploy | ${deployStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            **Commit:** \`${{ github.event.pull_request.head.sha }}\`
            **Workflow:** [${context.workflow}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${deployStatus === 'passed' && '${{ needs.deploy-dev.outputs.cloudfront_url }}' && '${{ needs.deploy-dev.outputs.cloudfront_url }}' !== '' 
              ? `**🌐 Preview:** [${{ needs.deploy-dev.outputs.cloudfront_url }}](${{ needs.deploy-dev.outputs.cloudfront_url }})` 
              : ''}

            ${overallStatus === 'success' 
              ? '🎉 All checks passed! This PR is ready for review.' 
              : '⚠️ Some checks failed. Please review the logs and fix any issues.'}`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('PR Validation Results')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
