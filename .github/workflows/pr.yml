name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/_test.yml
    with:
      run-frontend-tests: true
      run-backend-tests: true
      test-timeout: 15

  build:
    name: Validation Build
    uses: ./.github/workflows/_build.yml
    with:
      environment: development
      build-frontend: true
      build-backend: true
      cache-enabled: true

  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            echo "test_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Tests passed"
            echo "test_status=passed" >> $GITHUB_ENV
          fi

      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            echo "build_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Build passed"
            echo "build_status=passed" >> $GITHUB_ENV
          fi

      - name: Set overall status
        run: |
          if [ "$test_status" = "passed" ] && [ "$build_status" = "passed" ]; then
            echo "✅ All checks passed - PR is ready for review"
            echo "overall_status=success" >> $GITHUB_ENV
          else
            echo "❌ Some checks failed - PR needs attention"
            echo "overall_status=failure" >> $GITHUB_ENV
            exit 1
          fi

      - name: Create PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const testStatus = process.env.test_status;
            const buildStatus = process.env.build_status;
            const overallStatus = process.env.overall_status;

            const testEmoji = testStatus === 'passed' ? '✅' : '❌';
            const buildEmoji = buildStatus === 'passed' ? '✅' : '❌';
            const overallEmoji = overallStatus === 'success' ? '✅' : '❌';

            const body = `## ${overallEmoji} PR Validation Results

            | Check | Status | Details |
            |-------|--------|---------|
            | ${testEmoji} Tests | ${testStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | ${buildEmoji} Build | ${buildStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            **Commit:** \`${{ github.event.pull_request.head.sha }}\`
            **Workflow:** [${context.workflow}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${overallStatus === 'success' 
              ? '🎉 All checks passed! This PR is ready for review.' 
              : '⚠️ Some checks failed. Please review the logs and fix any issues.'}`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('PR Validation Results')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
