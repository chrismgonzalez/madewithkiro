name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/_test.yml
    with:
      run-frontend-tests: true
      run-backend-tests: true
      test-timeout: 15

  build:
    name: Validation Build
    uses: ./.github/workflows/_build.yml
    with:
      environment: development
      build-frontend: true
      build-backend: true
      cache-enabled: true

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development
    needs: [test, build]
    if: needs.test.result == 'success' && needs.build.result == 'success'
    outputs:
      cloudfront_url: ${{ steps.deploy.outputs.cloudfront_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Debug environment variables
        run: |
          echo "AWS_REGION: ${{ vars.AWS_REGION }}"
          echo "DEPLOYMENT_ROLE_ARN: ${{ vars.DEPLOYMENT_ROLE_ARN }}"

      - name: Configure AWS credentials
        uses: ./.github/actions/aws-auth
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}

      - name: Install dependencies
        run: |
          bun install
          cd backend && uv pip install -e .

      - name: Create environment file
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USER_POOL_ID: ${{ vars.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ vars.VITE_USER_POOL_CLIENT_ID }}
          VITE_AWS_REGION: ${{ vars.AWS_REGION }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_IDENTITY_POOL_ID: ${{ vars.VITE_IDENTITY_POOL_ID }}
          VITE_OAUTH_REDIRECT_SIGN_IN: ${{ vars.VITE_OAUTH_REDIRECT_SIGN_IN }}
          VITE_OAUTH_REDIRECT_SIGN_OUT: ${{ vars.VITE_OAUTH_REDIRECT_SIGN_OUT }}
          VITE_ENVIRONMENT: development
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_USE_PROXY: ${{ vars.VITE_POSTHOG_USE_PROXY }}
        run: env | grep '^VITE_\|^DEV_' > .env.development

      - name: Deploy to development
        id: deploy
        env:
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRO_ID: ${{ vars.CLOUDFRONT_DISTRO_ID }}
        run: |
          make deploy-dev
          # Get CloudFront URL from stack outputs
          CLOUDFRONT_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name madewithkiro-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDomainName`].OutputValue' \
            --output text 2>/dev/null || echo "")
          if [ -n "$CLOUDFRONT_DOMAIN" ]; then
            CLOUDFRONT_URL="https://$CLOUDFRONT_DOMAIN"
          else
            CLOUDFRONT_URL=""
          fi
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [test, build, deploy-dev]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            echo "test_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Tests passed"
            echo "test_status=passed" >> $GITHUB_ENV
          fi

      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            echo "build_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Build passed"
            echo "build_status=passed" >> $GITHUB_ENV
          fi

      - name: Check deploy results
        run: |
          if [ "${{ needs.deploy-dev.result }}" != "success" ]; then
            echo "❌ Deploy failed"
            echo "deploy_status=failed" >> $GITHUB_ENV
          else
            echo "✅ Deploy passed"
            echo "deploy_status=passed" >> $GITHUB_ENV
          fi

      - name: Set overall status
        run: |
          if [ "$test_status" = "passed" ] && [ "$build_status" = "passed" ] && [ "$deploy_status" = "passed" ]; then
            echo "✅ All checks passed - PR is ready for review"
            echo "overall_status=success" >> $GITHUB_ENV
          else
            echo "❌ Some checks failed - PR needs attention"
            echo "overall_status=failure" >> $GITHUB_ENV
            exit 1
          fi

      - name: Create PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const testStatus = process.env.test_status;
            const buildStatus = process.env.build_status;
            const deployStatus = process.env.deploy_status;
            const overallStatus = process.env.overall_status;

            const testEmoji = testStatus === 'passed' ? '✅' : '❌';
            const buildEmoji = buildStatus === 'passed' ? '✅' : '❌';
            const deployEmoji = deployStatus === 'passed' ? '✅' : '❌';
            const overallEmoji = overallStatus === 'success' ? '✅' : '❌';

            const body = `## ${overallEmoji} PR Validation Results

            | Check | Status | Details |
            |-------|--------|---------|
            | ${testEmoji} Tests | ${testStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | ${buildEmoji} Build | ${buildStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | ${deployEmoji} Deploy | ${deployStatus} | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            **Commit:** \`${{ github.event.pull_request.head.sha }}\`
            **Workflow:** [${context.workflow}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${deployStatus === 'passed' && '${{ needs.deploy-dev.outputs.cloudfront_url }}' 
              ? `**🌐 Preview:** [${{ needs.deploy-dev.outputs.cloudfront_url }}](${{ needs.deploy-dev.outputs.cloudfront_url }})` 
              : ''}

            ${overallStatus === 'success' 
              ? '🎉 All checks passed! This PR is ready for review.' 
              : '⚠️ Some checks failed. Please review the logs and fix any issues.'}`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('PR Validation Results')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
