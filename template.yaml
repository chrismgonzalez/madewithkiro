AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MadeWithKiro - Serverless showcase platform for Kiro applications

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name

  CognitoCallbackURL:
    Type: CommaDelimitedList
    Description: Callback URLs for Cognito authentication (comma-separated)
    Default: http://localhost:5173/auth/callback

  CognitoLogoutURL:
    Type: CommaDelimitedList
    Description: Logout redirect URLs for Cognito (comma-separated)
    Default: http://localhost:5173

  DomainName:
    Type: String
    Description: Custom domain name (e.g., madewithkiro.com). Leave empty to skip custom domain setup.
    Default: ""

  HostedZoneId:
    Type: String
    Description: Route 53 Hosted Zone ID for the domain. Leave empty to create a new hosted zone.
    Default: ""

  CertificateArn:
    Type: String
    Description: ARN of ACM Certificate in us-east-1 (required for custom domain with CloudFront). Leave empty if no custom domain.
    Default: ""

  GoogleClientIdParameter:
    Type: String
    Description: SSM Parameter name containing Google OAuth Client ID
    Default: /madewithkiro/google-client-id

  GoogleClientSecretParameter:
    Type: String
    Description: SSM Parameter name containing Google OAuth Client Secret
    Default: /madewithkiro/google-client-secret

  GitHubClientIdParameter:
    Type: String
    Description: SSM Parameter name containing GitHub OAuth Client ID
    Default: /madewithkiro/github-client-id

  GitHubClientSecretParameter:
    Type: String
    Description: SSM Parameter name containing GitHub OAuth Client Secret
    Default: /madewithkiro/github-client-secret

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  CreateHostedZone: !And
    - !Condition HasCustomDomain
    - !Equals [!Ref HostedZoneId, ""]
  # Always create CloudFront for both dev and prod
  CreateCloudFront: !Or
    - !Equals [!Ref Environment, "dev"]
    - !Equals [!Ref Environment, "prod"]
  # Check if OAuth parameters exist in SSM (we'll assume they do if parameter names are provided)
  HasGoogleOAuth: !Not [!Equals [!Ref GoogleClientIdParameter, ""]]
  HasGitHubOAuth: !Not [!Equals [!Ref GitHubClientIdParameter, ""]]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref MadeWithKiroTable
        COGNITO_USER_POOL_ID: !Ref CognitoUserPool
        ENVIRONMENT: !Ref Environment

  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  # DynamoDB Table with Single-Table Design
  MadeWithKiroTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub MadeWithKiro-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MadeWithKiro

  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub MadeWithKiro-${Environment}
      # Social auth only - no password policy needed
      AutoVerifiedAttributes:
        - email
      # Standard attributes for social auth
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: picture
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # Google Identity Provider
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleOAuth
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Sub "{{resolve:ssm:${GoogleClientIdParameter}}}"
        client_secret: !Sub "{{resolve:ssm:${GoogleClientSecretParameter}}}"
        authorize_scopes: "profile email openid"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        picture: picture
        username: sub

  # GitHub Identity Provider
  # Note: GitHub uses OAuth 2.0, not OIDC, but Cognito requires OIDC type
  GitHubIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGitHubOAuth
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ProviderName: GitHub
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Sub "{{resolve:ssm:${GitHubClientIdParameter}}}"
        client_secret: !Sub "{{resolve:ssm:${GitHubClientSecretParameter}}}"
        authorize_scopes: "read:user user:email"
        attributes_request_method: GET
        oidc_issuer: "https://github.com"
        authorize_url: "https://github.com/login/oauth/authorize"
        token_url: "https://github.com/login/oauth/access_token"
        attributes_url: "https://api.github.com/user"
        jwks_uri: "https://token.actions.githubusercontent.com/.well-known/jwks"
        attributes_url_add_attributes: "false"
      AttributeMapping:
        email: email
        name: name
        picture: avatar_url
        username: sub

  # Cognito User Pool Client
  # Note: Must be created after identity providers
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
      - GitHubIdentityProvider
    Properties:
      ClientName: !Sub MadeWithKiro-Client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs: !Ref CognitoCallbackURL
      LogoutURLs: !Ref CognitoLogoutURL
      SupportedIdentityProviders:
        - Google
        - GitHub
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes

  # Cognito User Pool Domain
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub madewithkiro-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref CognitoUserPool

  # Cognito Identity Pool
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub MadeWithKiro-${Environment}
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  # Cognito Identity Pool Roles
  CognitoIdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  # IAM Role for Authenticated Users
  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub MadeWithKiro-CognitoAuthRole-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: CognitoAuthenticatedPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-identity:GetCredentialsForIdentity
                  - cognito-identity:GetId
                Resource: "*"

  # API Gateway
  MadeWithKiroApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub MadeWithKiro-API-${Environment}
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # Profile Lambda Function
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub MadeWithKiro-Profile-${Environment}
      CodeUri: backend/
      Handler: profile.handler.lambda_handler
      Description: Handle profile operations (create, read, update)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MadeWithKiroTable
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /profile/{userId}
            Method: GET
            Auth:
              Authorizer: NONE
        CreateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /profile
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /profile
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # Application Lambda Function
  ApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub MadeWithKiro-Application-${Environment}
      CodeUri: backend/
      Handler: application.handler.lambda_handler
      Description: Handle application operations (create, list, query)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MadeWithKiroTable
      Events:
        ListApplications:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications
            Method: GET
            Auth:
              Authorizer: NONE
        GetApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications/{appId}
            Method: GET
            Auth:
              Authorizer: NONE
        CreateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications
            Method: POST
            Auth:
              Authorizer: NONE
        UpdateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications/{appId}
            Method: PUT
            Auth:
              Authorizer: NONE
        DeleteApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications/{appId}
            Method: DELETE
            Auth:
              Authorizer: NONE
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # S3 Bucket for Frontend Hosting (Private - CloudFront only access)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub madewithkiro-frontend-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MadeWithKiro

  # S3 Bucket Policy - CloudFront Only Access (Private Bucket)
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateCloudFront
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # Route 53 Hosted Zone (created if not provided)
  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateHostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub Hosted zone for MadeWithKiro ${Environment}
      HostedZoneTags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MadeWithKiro

  # Note: ACM Certificate is created in separate stack in us-east-1
  # Deploy certificate-template.yaml first, then pass the ARN via CertificateArn parameter

  # CloudFront Distribution for Frontend
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub MadeWithKiro ${Environment} Distribution
        DefaultRootObject: index.html
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
        PriceClass: PriceClass_100
        HttpVersion: http2

  # CloudFront Origin Access Control
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub MadeWithKiro-OAC-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Route 53 Record for Custom Domain
  DomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref HostedZone
        - !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (constant)
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${MadeWithKiroApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  IdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref CognitoIdentityPool
    Export:
      Name: !Sub ${AWS::StackName}-IdentityPoolId

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub madewithkiro-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolDomain

  CognitoRegion:
    Description: AWS Region for Cognito
    Value: !Ref AWS::Region
    Export:
      Name: !Sub ${AWS::StackName}-CognitoRegion

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref MadeWithKiroTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  FrontendBucketName:
    Description: S3 Bucket for Frontend
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucket

  FrontendUrl:
    Description: Frontend Website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub ${AWS::StackName}-FrontendUrl

  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: Custom Domain URL (via CloudFront)
    Value: !Sub https://${DomainName}
    Export:
      Name: !Sub ${AWS::StackName}-CustomDomainUrl

  CloudFrontDistributionId:
    Condition: CreateCloudFront
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDistributionId

  CloudFrontDomainName:
    Condition: CreateCloudFront
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDomainName

  CloudFrontUrl:
    Condition: CreateCloudFront
    Description: CloudFront Distribution URL (use this for Cognito callback in dev)
    Value: !Sub https://${CloudFrontDistribution.DomainName}
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontUrl

  HostedZoneId:
    Condition: CreateHostedZone
    Description: Route 53 Hosted Zone ID (newly created)
    Value: !Ref HostedZone
    Export:
      Name: !Sub ${AWS::StackName}-HostedZoneId

  HostedZoneNameServers:
    Condition: CreateHostedZone
    Description: Name servers for the hosted zone (update these at your domain registrar)
    Value: !Join [", ", !GetAtt HostedZone.NameServers]

  CertificateArn:
    Condition: HasCertificate
    Description: ACM Certificate ARN (from separate certificate stack)
    Value: !Ref CertificateArn
    Export:
      Name: !Sub ${AWS::StackName}-CertificateArn
