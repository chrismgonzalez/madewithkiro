AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MadeWithKiro - Serverless showcase platform for Kiro applications

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name

  CognitoCallbackURL:
    Type: CommaDelimitedList
    Description: Callback URLs for Cognito authentication (comma-separated)
    Default: http://localhost:5173/auth/callback

  CognitoLogoutURL:
    Type: CommaDelimitedList
    Description: Logout redirect URLs for Cognito (comma-separated)
    Default: http://localhost:5173

  DomainName:
    Type: String
    Description: Custom domain name (e.g., madewithkiro.com). Leave empty to skip custom domain setup.
    Default: ""

  HostedZoneId:
    Type: String
    Description: Route 53 Hosted Zone ID for the domain. Leave empty to create a new hosted zone.
    Default: ""

  CertificateArn:
    Type: String
    Description: ARN of ACM Certificate in us-east-1 (required for custom domain with CloudFront). Leave empty if no custom domain.
    Default: ""

  CognitoCustomDomain:
    Type: String
    Description: Custom domain for Cognito (e.g., auth.madewithkiro.com). Leave empty to use default Cognito domain.
    Default: ""

  CognitoCertificateArn:
    Type: String
    Description: ARN of ACM Certificate in us-east-1 for Cognito custom domain. Required if CognitoCustomDomain is set.
    Default: ""

  GoogleClientIdParameter:
    Type: String
    Description: SSM Parameter name containing Google OAuth Client ID (environment-specific)

  GoogleClientSecretParameter:
    Type: String
    Description: SSM Parameter name containing Google OAuth Client Secret (environment-specific)

  SESEmailIdentity:
    Type: String
    Description: Email address for sending OTP codes (e.g., noreply@madewithkiro.com)
    Default: noreply@madewithkiro.com

  SESDomainName:
    Type: String
    Description: Domain name for SES email sending (e.g., madewithkiro.com)
    Default: madewithkiro.com

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasCognitoCustomDomain: !Not [!Equals [!Ref CognitoCustomDomain, ""]]
  HasCognitoCertificate: !Not [!Equals [!Ref CognitoCertificateArn, ""]]
  CreateHostedZone: !And
    - !Condition HasCustomDomain
    - !Equals [!Ref HostedZoneId, ""]
  # Always create CloudFront for both dev and prod
  CreateCloudFront: !Or
    - !Equals [!Ref Environment, "dev"]
    - !Equals [!Ref Environment, "prod"]
  IsProduction: !Equals [!Ref Environment, "prod"]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref MadeWithKiroTable
        ENVIRONMENT: !Ref Environment
        ALLOWED_ORIGINS: !If
          - IsProduction
          - !Sub "https://${DomainName}"
          - !Sub "http://localhost:5173,https://${CloudFrontDistribution.DomainName}"

  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: !If
        - IsProduction
        - !Sub "'https://${DomainName}'"
        - "'http://localhost:5173'"

Resources:
  # DynamoDB Table with Single-Table Design
  MadeWithKiroTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub MadeWithKiro-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MadeWithKiro

  # SES Email Identity for OTP Codes
  SESEmailIdentityResource:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SESEmailIdentity
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      FeedbackAttributes:
        EmailForwardingEnabled: false
      MailFromAttributes:
        MailFromDomain: !Sub mail.${SESDomainName}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # SES Configuration Set for OTP Emails
  SESConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub MadeWithKiro-OTP-${Environment}
      SendingOptions:
        SendingEnabled: true
      ReputationOptions:
        ReputationMetricsEnabled: true
      SuppressionOptions:
        SuppressedReasons:
          - BOUNCE
          - COMPLAINT

  # SES Email Template for OTP Codes
  SESEmailTemplate:
    Type: AWS::SES::Template
    Properties:
      Template:
        TemplateName: !Sub MadeWithKiro-OTP-${Environment}
        SubjectPart: Your MadeWithKiro verification code
        TextPart: |
          Your verification code is: {{code}}

          This code will expire in {{expiresIn}} minutes.

          If you didn't request this code, please ignore this email.

          Do not share this code with anyone.

          ---
          MadeWithKiro - Showcase your Kiro creations
          https://madewithkiro.com
        HtmlPart: |
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Your Verification Code</title>
          </head>
          <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; border-radius: 10px 10px 0 0; text-align: center;">
              <h1 style="color: white; margin: 0; font-size: 24px;">MadeWithKiro</h1>
            </div>
            <div style="background: #ffffff; padding: 40px; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 10px 10px;">
              <h2 style="color: #333; margin-top: 0;">Your verification code is:</h2>
              <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; text-align: center; margin: 30px 0;">
                <h1 style="font-size: 48px; letter-spacing: 12px; font-family: 'Courier New', monospace; color: #667eea; margin: 0;">{{code}}</h1>
              </div>
              <p style="color: #666; font-size: 14px; margin: 20px 0;">This code will expire in <strong>{{expiresIn}} minutes</strong>.</p>
              <p style="color: #666; font-size: 14px;">If you didn't request this code, please ignore this email.</p>
              <p style="color: #d32f2f; font-size: 14px; font-weight: bold;">⚠️ Do not share this code with anyone.</p>
            </div>
            <div style="text-align: center; margin-top: 30px; padding: 20px; color: #999; font-size: 12px;">
              <p style="margin: 5px 0;">MadeWithKiro - Showcase your Kiro creations</p>
              <p style="margin: 5px 0;"><a href="https://madewithkiro.com" style="color: #667eea; text-decoration: none;">https://madewithkiro.com</a></p>
            </div>
          </body>
          </html>

  # OTP Authentication Lambda Functions
  # These functions handle Cognito custom authentication flow for email OTP
  # Note: Defined before CognitoUserPool to avoid circular dependencies

  # DefineAuthChallenge Lambda - Determines authentication flow
  DefineAuthChallengeFunctionForOTP:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub MadeWithKiro-DefineAuthChallenge-${Environment}
      CodeUri: backend/
      Handler: auth.define_auth_challenge.lambda_handler
      Description: Define custom authentication flow and enforce rate limiting
      Environment:
        Variables:
          TABLE_NAME: !Ref MadeWithKiroTable
          ENVIRONMENT: !Ref Environment
      Policies:
        - Statement:
            - Sid: CloudWatchLogsAccess
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/MadeWithKiro-DefineAuthChallenge-${Environment}:*
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # CreateAuthChallenge Lambda - Generates and sends OTP codes
  CreateAuthChallengeFunctionForOTP:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub MadeWithKiro-CreateAuthChallenge-${Environment}
      CodeUri: backend/
      Handler: auth.create_auth_challenge.lambda_handler
      Description: Generate OTP codes and send via SES
      Environment:
        Variables:
          TABLE_NAME: !Ref MadeWithKiroTable
          ENVIRONMENT: !Ref Environment
          SES_EMAIL_IDENTITY: !Ref SESEmailIdentity
          SES_TEMPLATE_NAME: !Sub MadeWithKiro-OTP-${Environment}
          SES_CONFIGURATION_SET: !Ref SESConfigurationSet
      Policies:
        - Statement:
            - Sid: SESEmailSending
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendTemplatedEmail
                - ses:SendRawEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SESConfigurationSet}
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:template/MadeWithKiro-OTP-${Environment}
            - Sid: CloudWatchLogsAccess
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/MadeWithKiro-CreateAuthChallenge-${Environment}:*
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # VerifyAuthChallenge Lambda - Validates OTP and handles account linking
  VerifyAuthChallengeFunctionForOTP:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub MadeWithKiro-VerifyAuthChallenge-${Environment}
      CodeUri: backend/
      Handler: auth.verify_auth_challenge.lambda_handler
      Description: Verify OTP codes and link duplicate accounts
      Environment:
        Variables:
          TABLE_NAME: !Ref MadeWithKiroTable
          ENVIRONMENT: !Ref Environment
      Policies:
        - Statement:
            - Sid: DynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt MadeWithKiroTable.Arn
                - !Sub "${MadeWithKiroTable.Arn}/index/GSI1"
            - Sid: CognitoUserManagement
              Effect: Allow
              Action:
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminGetUser
                - cognito-idp:ListUsers
              Resource: "*" # Wildcard to avoid circular dependency
            - Sid: CloudWatchLogsAccess
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/MadeWithKiro-VerifyAuthChallenge-${Environment}:*
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub MadeWithKiro-${Environment}
      # Social auth only - no password policy needed
      AutoVerifiedAttributes:
        - email
      # Standard attributes for social auth and custom attributes for OTP
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: picture
          AttributeDataType: String
          Required: false
          Mutable: true
        # Custom attributes for account linking
        - Name: auth_methods
          AttributeDataType: String
          Mutable: true
        - Name: linked_account
          AttributeDataType: String
          Mutable: true
      # Email configuration for OTP delivery
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SESEmailIdentity}
        From: !Sub MadeWithKiro <${SESEmailIdentity}>
        ReplyToEmailAddress: !Ref SESEmailIdentity
      # Lambda triggers for custom authentication
      LambdaConfig:
        DefineAuthChallenge: !GetAtt DefineAuthChallengeFunctionForOTP.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeFunctionForOTP.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeFunctionForOTP.Arn
      UserPoolTags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # Google Identity Provider
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Sub "{{resolve:ssm:${GoogleClientIdParameter}}}"
        client_secret: !Sub "{{resolve:ssm:${GoogleClientSecretParameter}}}"
        authorize_scopes: "profile email openid"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        picture: picture
        username: sub

  # Cognito User Pool Client
  # Note: Must be created after identity providers
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub MadeWithKiro-Client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH # Enable custom authentication for OTP
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs: !Ref CognitoCallbackURL
      LogoutURLs: !Ref CognitoLogoutURL
      SupportedIdentityProviders:
        - Google
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes

  # Cognito User Pool Domain (Default or Custom)
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If
        - HasCognitoCustomDomain
        - !Ref CognitoCustomDomain
        - !Sub madewithkiro-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref CognitoUserPool
      CustomDomainConfig: !If
        - HasCognitoCustomDomain
        - CertificateArn: !Ref CognitoCertificateArn
        - !Ref AWS::NoValue

  # Route 53 Record for Cognito Custom Domain
  CognitoDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCognitoCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CognitoCustomDomain
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (constant for Cognito custom domains)
        DNSName: !GetAtt CognitoUserPoolDomain.CloudFrontDistribution
        EvaluateTargetHealth: false

  # Cognito Identity Pool
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub MadeWithKiro-${Environment}
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  # Cognito Identity Pool Roles
  CognitoIdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  # IAM Role for Authenticated Users
  # Least-privilege role for Cognito authenticated users
  # Allows: Only Cognito Identity operations for credential management
  # Restricts: No direct AWS service access (API calls go through Lambda)
  # Rationale: Frontend uses Cognito for auth, Lambda functions handle all AWS operations
  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub MadeWithKiro-CognitoAuthRole-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCognitoIdentityAssumeRole
            Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: CognitoAuthenticatedPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CognitoIdentityAccess
                Effect: Allow
                Action:
                  - cognito-identity:GetCredentialsForIdentity # Get temporary AWS credentials
                  - cognito-identity:GetId # Get identity ID
                Resource: "*"
                # Note: cognito-identity actions require wildcard resource
                # This is AWS-recommended pattern for Cognito Identity Pool roles

  # Lambda Permissions for Cognito to invoke OTP authentication functions
  # Note: SourceArn is omitted to avoid circular dependency with CognitoUserPool
  DefineAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DefineAuthChallengeFunctionForOTP
      Principal: cognito-idp.amazonaws.com
      Action: lambda:InvokeFunction

  CreateAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateAuthChallengeFunctionForOTP
      Principal: cognito-idp.amazonaws.com
      Action: lambda:InvokeFunction

  VerifyAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VerifyAuthChallengeFunctionForOTP
      Principal: cognito-idp.amazonaws.com
      Action: lambda:InvokeFunction

  # API Gateway
  MadeWithKiroApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub MadeWithKiro-API-${Environment}
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      # Rate Limiting and Throttling Configuration
      # Dev environment: Higher limits for testing and development
      # Prod environment: Standard limits to prevent abuse
      MethodSettings:
        # Default throttling for all methods
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !If [IsProduction, 100, 500] # requests per second (prod: 100, dev: 500)
          ThrottlingBurstLimit: !If [IsProduction, 200, 1000] # concurrent requests (prod: 200, dev: 1000)
          MetricsEnabled: true
        # Public read endpoints - Higher limits for browsing
        - ResourcePath: "/applications"
          HttpMethod: "GET"
          ThrottlingRateLimit: !If [IsProduction, 200, 1000] # Higher for public gallery (prod: 200, dev: 1000)
          ThrottlingBurstLimit: !If [IsProduction, 400, 2000] # (prod: 400, dev: 2000)
        - ResourcePath: "/applications/{appId}"
          HttpMethod: "GET"
          ThrottlingRateLimit: !If [IsProduction, 200, 1000] # Higher for viewing apps (prod: 200, dev: 1000)
          ThrottlingBurstLimit: !If [IsProduction, 400, 2000] # (prod: 400, dev: 2000)
        - ResourcePath: "/profile/{userId}"
          HttpMethod: "GET"
          ThrottlingRateLimit: !If [IsProduction, 150, 750] # Higher for profile viewing (prod: 150, dev: 750)
          ThrottlingBurstLimit: !If [IsProduction, 300, 1500] # (prod: 300, dev: 1500)
        # Create operations - Lower limits to prevent abuse
        - ResourcePath: "/applications"
          HttpMethod: "POST"
          ThrottlingRateLimit: !If [IsProduction, 10, 50] # Lower for creates (prod: 10, dev: 50)
          ThrottlingBurstLimit: !If [IsProduction, 20, 100] # (prod: 20, dev: 100)
        - ResourcePath: "/profile"
          HttpMethod: "POST"
          ThrottlingRateLimit: !If [IsProduction, 5, 25] # Very low for profile creation (prod: 5, dev: 25)
          ThrottlingBurstLimit: !If [IsProduction, 10, 50] # (prod: 10, dev: 50)
        # Update operations - Standard limits
        - ResourcePath: "/applications/{appId}"
          HttpMethod: "PUT"
          ThrottlingRateLimit: !If [IsProduction, 50, 250] # Standard for updates (prod: 50, dev: 250)
          ThrottlingBurstLimit: !If [IsProduction, 100, 500] # (prod: 100, dev: 500)
        - ResourcePath: "/profile"
          HttpMethod: "PUT"
          ThrottlingRateLimit: !If [IsProduction, 50, 250] # Standard for profile updates (prod: 50, dev: 250)
          ThrottlingBurstLimit: !If [IsProduction, 100, 500] # (prod: 100, dev: 500)
        # Delete operations - Lower limits for safety
        - ResourcePath: "/applications/{appId}"
          HttpMethod: "DELETE"
          ThrottlingRateLimit: !If [IsProduction, 20, 100] # Lower for deletes (prod: 20, dev: 100)
          ThrottlingBurstLimit: !If [IsProduction, 40, 200] # (prod: 40, dev: 200)
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # Profile Lambda Function
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub MadeWithKiro-Profile-${Environment}
      CodeUri: backend/
      Handler: profile.handler.lambda_handler
      Description: Handle profile operations (create, read, update)
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
      Policies:
        # Least-privilege IAM policy for profile operations
        # Allows: GetItem, PutItem, UpdateItem on specific table
        # Restricts: Only USER# partition keys for user-specific access
        # Rationale: Profile function only needs to read/write user profile records
        - Statement:
            - Sid: ProfileDynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem # Read user profile
                - dynamodb:PutItem # Create new profile
                - dynamodb:UpdateItem # Update existing profile
              Resource: !GetAtt MadeWithKiroTable.Arn
              # Note: Condition keys for user-specific access would require
              # Cognito integration to pass userId in request context
              # For now, application logic enforces user-specific access
        # CloudWatch Logs permissions (automatically added by SAM)
        # Allows: CreateLogGroup, CreateLogStream, PutLogEvents
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /profile/{userId}
            Method: GET
            Auth:
              Authorizer: NONE
        CreateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /profile
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /profile
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # Application Lambda Function
  ApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub MadeWithKiro-Application-${Environment}
      CodeUri: backend/
      Handler: application.handler.lambda_handler
      Description: Handle application operations (create, list, query)
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
      Policies:
        # Least-privilege IAM policy for application operations
        # Allows: GetItem, PutItem, UpdateItem, DeleteItem, Query, Scan
        # Restricts: Specific table and GSI access only
        # Rationale: Application function needs full CRUD + query/scan for listings
        - Statement:
            - Sid: ApplicationDynamoDBTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem # Read single application or user profile
                - dynamodb:PutItem # Create/update application
                - dynamodb:UpdateItem # Update application fields
                - dynamodb:DeleteItem # Delete application
                - dynamodb:Query # Query by PK (not used currently)
                - dynamodb:Scan # Scan for all applications (list_all)
              Resource: !GetAtt MadeWithKiroTable.Arn
            - Sid: ApplicationDynamoDBIndexAccess
              Effect: Allow
              Action:
                - dynamodb:Query # Query GSI1 for user's applications
              Resource: !Sub "${MadeWithKiroTable.Arn}/index/GSI1"
              # Note: Ownership validation is enforced in application logic
              # User can only modify/delete their own applications
        # CloudWatch Logs permissions (automatically added by SAM)
        # Allows: CreateLogGroup, CreateLogStream, PutLogEvents
      Events:
        ListApplications:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications
            Method: GET
            Auth:
              Authorizer: NONE
        GetApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications/{appId}
            Method: GET
            Auth:
              Authorizer: NONE
        CreateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications/{appId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        DeleteApplication:
          Type: Api
          Properties:
            RestApiId: !Ref MadeWithKiroApi
            Path: /applications/{appId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        Application: MadeWithKiro

  # S3 Bucket for Frontend Hosting (Private - CloudFront only access)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub madewithkiro-frontend-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MadeWithKiro

  # CloudFront Origin Access Control
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub MadeWithKiro-OAC-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution for Frontend
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub MadeWithKiro ${Environment} Distribution
        DefaultRootObject: index.html
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
          - Id: PostHogOrigin
            DomainName: us.i.posthog.com
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        CacheBehaviors:
          - PathPattern: /ingest/*
            TargetOriginId: PostHogOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled managed policy
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer managed policy
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
          ResponseHeadersPolicyId: !Ref CloudFrontResponseHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
        PriceClass: PriceClass_100
        HttpVersion: http2

  # S3 Bucket Policy - CloudFront Only Access (Private Bucket)
  # Must be created AFTER CloudFront distribution to avoid circular dependency
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateCloudFront
    DependsOn: CloudFrontDistribution
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # Route 53 Hosted Zone (created if not provided)
  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateHostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub Hosted zone for MadeWithKiro ${Environment}
      HostedZoneTags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MadeWithKiro

  # Note: ACM Certificate is created in separate stack in us-east-1
  # Deploy certificate-template.yaml first, then pass the ARN via CertificateArn parameter

  # CloudFront Response Headers Policy for Security Headers
  CloudFrontResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: CreateCloudFront
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub MadeWithKiro-SecurityHeaders-${Environment}
        Comment: Security headers policy for MadeWithKiro application
        SecurityHeadersConfig:
          # HSTS - Force HTTPS for 1 year, include subdomains, allow preloading
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000 # 1 year
            IncludeSubdomains: true
            Preload: true
            Override: true
          # X-Content-Type-Options - Prevent MIME type sniffing
          ContentTypeOptions:
            Override: true
          # X-Frame-Options - Prevent clickjacking by denying iframe embedding
          FrameOptions:
            FrameOption: DENY
            Override: true
          # X-XSS-Protection - Enable browser XSS protection (legacy browsers)
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          # Referrer-Policy - Control referrer information sent with requests
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          # Content-Security-Policy - Restrict resource loading to prevent XSS
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://us-assets.i.posthog.com https://eu-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.execute-api.us-west-2.amazonaws.com https://cognito-idp.us-west-2.amazonaws.com https://cognito-identity.us-west-2.amazonaws.com https://auth-dev.madewithkiro.com https://auth.madewithkiro.com https://us.i.posthog.com https://us-assets.i.posthog.com; script-src-elem 'self' 'unsafe-inline' https://us-assets.i.posthog.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true

  # Route 53 Record for Custom Domain
  DomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref HostedZone
        - !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (constant)
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${MadeWithKiroApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  IdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref CognitoIdentityPool
    Export:
      Name: !Sub ${AWS::StackName}-IdentityPoolId

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !If
      - HasCognitoCustomDomain
      - !Ref CognitoCustomDomain
      - !Sub madewithkiro-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolDomain

  CognitoHostedUIUrl:
    Description: Cognito Hosted UI URL (use this for OAuth login)
    Value: !If
      - HasCognitoCustomDomain
      - !Sub https://${CognitoCustomDomain}
      - !Sub https://madewithkiro-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
    Export:
      Name: !Sub ${AWS::StackName}-CognitoHostedUIUrl

  CognitoRegion:
    Description: AWS Region for Cognito
    Value: !Ref AWS::Region
    Export:
      Name: !Sub ${AWS::StackName}-CognitoRegion

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref MadeWithKiroTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  FrontendBucketName:
    Description: S3 Bucket for Frontend
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucket

  FrontendUrl:
    Description: Frontend Website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub ${AWS::StackName}-FrontendUrl

  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: Custom Domain URL (via CloudFront)
    Value: !Sub https://${DomainName}
    Export:
      Name: !Sub ${AWS::StackName}-CustomDomainUrl

  CloudFrontDistributionId:
    Condition: CreateCloudFront
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDistributionId

  CloudFrontDomainName:
    Condition: CreateCloudFront
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDomainName

  CloudFrontUrl:
    Condition: CreateCloudFront
    Description: CloudFront Distribution URL (use this for Cognito callback in dev)
    Value: !Sub https://${CloudFrontDistribution.DomainName}
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontUrl

  HostedZoneId:
    Condition: CreateHostedZone
    Description: Route 53 Hosted Zone ID (newly created)
    Value: !Ref HostedZone
    Export:
      Name: !Sub ${AWS::StackName}-HostedZoneId

  HostedZoneNameServers:
    Condition: CreateHostedZone
    Description: Name servers for the hosted zone (update these at your domain registrar)
    Value: !Join [", ", !GetAtt HostedZone.NameServers]

  CertificateArn:
    Condition: HasCertificate
    Description: ACM Certificate ARN (from separate certificate stack)
    Value: !Ref CertificateArn
    Export:
      Name: !Sub ${AWS::StackName}-CertificateArn

  ResponseHeadersPolicyId:
    Condition: CreateCloudFront
    Description: CloudFront Response Headers Policy ID for security headers
    Value: !Ref CloudFrontResponseHeadersPolicy
    Export:
      Name: !Sub ${AWS::StackName}-ResponseHeadersPolicyId

  SESEmailIdentity:
    Description: SES Email Identity for OTP codes
    Value: !Ref SESEmailIdentity
    Export:
      Name: !Sub ${AWS::StackName}-SESEmailIdentity

  SESConfigurationSet:
    Description: SES Configuration Set for OTP emails
    Value: !Ref SESConfigurationSet
    Export:
      Name: !Sub ${AWS::StackName}-SESConfigurationSet

  SESEmailTemplate:
    Description: SES Email Template for OTP codes
    Value: !Sub MadeWithKiro-OTP-${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-SESEmailTemplate

  DefineAuthChallengeFunctionArn:
    Description: DefineAuthChallenge Lambda Function ARN
    Value: !GetAtt DefineAuthChallengeFunctionForOTP.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DefineAuthChallengeFunctionArn

  CreateAuthChallengeFunctionArn:
    Description: CreateAuthChallenge Lambda Function ARN
    Value: !GetAtt CreateAuthChallengeFunctionForOTP.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CreateAuthChallengeFunctionArn

  VerifyAuthChallengeFunctionArn:
    Description: VerifyAuthChallenge Lambda Function ARN
    Value: !GetAtt VerifyAuthChallengeFunctionForOTP.Arn
    Export:
      Name: !Sub ${AWS::StackName}-VerifyAuthChallengeFunctionArn
