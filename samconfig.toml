version = 0.1

[default]
[default.global.parameters]
stack_name = "madewithkiro"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Development Environment Configuration
[dev]
[dev.global.parameters]
stack_name = "madewithkiro-dev"

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"
parameter_overrides = [
  "Environment=dev",
  "CognitoCallbackURL=http://localhost:5173",
  "DomainName=",
  "HostedZoneId=",
]
tags = ["Environment=dev", "Application=MadeWithKiro"]

# Production Environment Configuration
[prod]
[prod.global.parameters]
stack_name = "madewithkiro-prod"

[prod.build.parameters]
cached = true
parallel = true

[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = [
  "Environment=prod",
  "CognitoCallbackURL=https://madewithkiro.com",
  "DomainName=madewithkiro.com",
  "HostedZoneId=",
]
tags = ["Environment=prod", "Application=MadeWithKiro"]
