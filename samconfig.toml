version = 0.1

[default]
[default.global.parameters]
stack_name = "madewithkiro"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-west-2"

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Development Environment Configuration
[dev]
[dev.global.parameters]
stack_name = "madewithkiro-dev"

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-west-2"
parameter_overrides = [
  "Environment=dev",
  # Multiple callback URLs: local development + deployed dev environment
  # Format: comma-separated list (no spaces) - must include /auth/callback path
  "CognitoCallbackURL=http://localhost:5173/auth/callback,https://dh1nph2ldx21y.cloudfront.net/auth/callback",
  # Logout URLs redirect to home page (unauthenticated)
  "CognitoLogoutURL=http://localhost:5173,https://dh1nph2ldx21y.cloudfront.net",
  # OAuth Client IDs and Secrets are stored in SSM Parameter Store
  # Use the setup-ssm-parameters.sh script to configure these values
  # Environment-specific SSM parameter paths for dev
  "GoogleClientIdParameter=/madewithkiro/dev/google-client-id",
  "GoogleClientSecretParameter=/madewithkiro/dev/google-client-secret",
  # DomainName and HostedZoneId omitted - will use template defaults (empty strings)
]
tags = ["Environment=dev", "Application=MadeWithKiro"]

# Production Environment Configuration
[prod]
[prod.global.parameters]
stack_name = "madewithkiro-prod"

[prod.build.parameters]
cached = true
parallel = true

[prod.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-west-2"
parameter_overrides = [
  "Environment=prod",
  "CognitoCallbackURL=https://madewithkiro.com/auth/callback",
  "CognitoLogoutURL=https://madewithkiro.com",
  # OAuth Client IDs and Secrets are stored in SSM Parameter Store
  # Use the setup-ssm-parameters.sh script to configure these values
  # Environment-specific SSM parameter paths for prod
  "GoogleClientIdParameter=/madewithkiro/prod/google-client-id",
  "GoogleClientSecretParameter=/madewithkiro/prod/google-client-secret",
  "DomainName=madewithkiro.com",
  "HostedZoneId=Z00541582Q16QTXW4013F",
  "CertificateArn=arn:aws:acm:us-east-1:633458675472:certificate/28a5f528-69f7-4fa3-a831-aa0e5c21a24f",
]
tags = ["Environment=prod", "Application=MadeWithKiro"]
